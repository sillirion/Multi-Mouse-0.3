name: Build Windows Lightgun DLLs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        target: [template_debug, template_release]

    steps:
      - name: Checkout source and godot-cpp
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SCons
        run: python -m pip install scons

      - name: Build ${{ matrix.target }}
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Target ${{ matrix.target }} -Arch x86_64

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: multi-mouse-windows-${{ matrix.target }}-x86_64
          path: addons/multi_mouse/bin/win64/libmulti_mouse.windows.${{ matrix.target }}.x86_64.dll
          if-no-files-found: error

  bundle:
    needs: build
    runs-on: windows-2022
    steps:
      - name: Download compiled DLLs
        uses: actions/download-artifact@v4
        with:
          path: compiled
          merge-multiple: true
      - name: Upload both DLLs together
        uses: actions/upload-artifact@v4
        with:
          name: multi-mouse-lightgun-windows-x86_64
          path: compiled/*.dll
          if-no-files-found: error
